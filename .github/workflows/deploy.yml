name: CI/CD Deploy to VPS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Application
        env:
          NEXT_PUBLIC_APP_URL: "https://bohoartjoyeria.com"
          DATABASE_URL: "sqlserver://localhost:1433;database=BohoartDB;user=sa;password=MockPassword123!;encrypt=false;trustServerCertificate=true"
          JWT_SECRET: "ci_build_dummy_secret_key"
        run: npm run build

  deploy:
    name: Deploy to VPS via SSH
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/docker/clientes/bohoart"
            echo "🚀 Iniciando despliegue de Bohoart Jewelry en $APP_DIR..."
            
            mkdir -p "$APP_DIR/uploads"
            cd "$APP_DIR"
            
            # Si el directorio no tiene git inicializado, inicializar y sincronizar con origin
            if [ ! -d ".git" ]; then
              echo "Configurando repositorio git en $APP_DIR..."
              git init
              git remote add origin https://github.com/${{ github.repository }}.git 2>/dev/null || git remote set-url origin https://github.com/${{ github.repository }}.git
              git fetch origin main
              git reset --hard origin/main
              git branch -M main
            else
              echo "Actualizando repositorio..."
              git fetch origin main
              git reset --hard origin/main
            fi
            
            echo "📦 Reconstruyendo contenedores Docker con Traefik..."
            docker compose up -d --build --remove-orphans
            
            echo "🗄️ Aplicando migraciones de base de datos..."
            docker compose exec -T bohoart npx prisma db push --accept-data-loss || true
            
            echo "✨ Despliegue completado con éxito en https://bohoartjoyeria.com"
